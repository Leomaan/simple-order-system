paths:
  /user:
    get:
      summary: Lista todos os usuários (Admin)
      tags: [Usuário]
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: OK }

    post:
      summary: Cria um novo usuário (Admin)
      tags: [Usuário]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string, example: João Silva }
                email: { type: string, example: joao@restaurant.com }
                password: { type: string, example: senha123 }
                role: { type: string, enum: [ADMIN, WAITER] }
      responses:
        201: { description: Usuário criado }
        400: { description: Email já cadastrado }

  /user/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }

    get:
      summary: Busca usuário por ID (Admin)
      tags: [Usuário]
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: OK }
        404: { description: Usuário não encontrado }

    patch:
      summary: Edita usuário (Admin)
      tags: [Usuário]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string, enum: [ADMIN, WAITER] }
                active: { type: boolean }
      responses:
        200: { description: Usuário atualizado }

    delete:
      summary: Soft delete do usuário (Admin)
      tags: [Usuário]
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Usuário removido }

  /user/{id}/restore:
    patch:
      summary: Restaura usuário deletado (Admin)
      tags: [Usuário]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        200: { description: Usuário restaurado }
        404: { description: Usuário não encontrado ou não deletado }

  /user/{id}/permanent:
    delete:
      summary: Delete permanente do usuário (Admin)
      tags: [Usuário]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        200: { description: Usuário permanentemente deletado }