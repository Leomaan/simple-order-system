paths:
  /report/today:
    get:
      summary: Vendas do dia (Admin)
      tags: [Relatórios]
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: Resumo das vendas do dia
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      date: { type: string, format: date, example: '2026-06-02' }
                      totalOrders: { type: integer, example: 12 }
                      totalRevenue: { type: number, example: 850.50 }
        401: { $ref: '#/components/responses/Unauthorized' }
        403: { description: Acesso restrito ao administrador }

  /report/revenue:
    get:
      summary: Faturamento por período (Admin)
      tags: [Relatórios]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date, example: '2026-01-01' }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date, example: '2026-12-31' }
      responses:
        200:
          description: Faturamento no período
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      totalOrders: { type: integer, example: 45 }
                      totalRevenue: { type: number, example: 3250.90 }
        400: { $ref: '#/components/responses/BadRequest' }
        401: { $ref: '#/components/responses/Unauthorized' }
        403: { description: Acesso restrito ao administrador }

  /report/orders:
    get:
      summary: Pedidos por período (Admin)
      tags: [Relatórios]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date, example: '2026-01-01' }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date, example: '2026-12-31' }
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [OPEN, PAID, CLOSED]
      responses:
        200:
          description: Lista de pedidos no período
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      status: { type: string, example: 'ALL' }
                      totalOrders: { type: integer, example: 20 }
                      orders:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
        400: { $ref: '#/components/responses/BadRequest' }
        401: { $ref: '#/components/responses/Unauthorized' }
        403: { description: Acesso restrito ao administrador }