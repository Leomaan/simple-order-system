paths:
  /settings:
    get:
      summary: Retorna as configurações do restaurante
      tags: [Configurações]
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: Configurações carregadas com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: integer, example: 1 }
                      restaurantName: { type: string, example: "Simple Order Restaurant" }
                      mercadoPagoAccessToken: { type: string, example: "TEST-1234...********1234" }
                      mercadoPagoWebhookSecret: { type: string, example: "********" }
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: Acesso restrito ao administrador

    put:
      summary: Atualiza as configurações do restaurante
      tags: [Configurações]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurantName]
              properties:
                restaurantName: { type: string, example: "Simple Order Pizzaria" }
                mercadoPagoAccessToken: { type: string, example: "TEST-12345678-abcdef-..." }
                mercadoPagoWebhookSecret: { type: string, example: "my_secret_key" }
      responses:
        200:
          description: Configurações atualizadas com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: integer, example: 1 }
                      restaurantName: { type: string, example: "Simple Order Pizzaria" }
                      mercadoPagoAccessToken: { type: string, example: "TEST-1234...********1234" }
                      mercadoPagoWebhookSecret: { type: string, example: "********" }
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: Acesso restrito ao administrador
